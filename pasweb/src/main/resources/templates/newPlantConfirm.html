<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New plant - confirm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/holiday.css@0.11.6" />
</head>
<body>
<h1>New plant - confirm</h1>

<form id="confirmplant" action="#" method="post" th:action="@{/newPlant/save}">
    <table>
        <thead>
        <tr>
            <th>Field</th>
            <th>Value</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Name</td>
            <td th:text="${newPlant.name}"></td>
        </tr>
        <tr>
            <td>Color</td>
            <td th:text="${newPlant.color}"></td>
        </tr>
        <tr>
            <td>Cost</td>
            <td th:text="${newPlant.cost}"></td>
        </tr>
        <tr>
            <td>Type</td>
            <td th:text="${newPlant.type}"></td>
        </tr>
        </tbody>
    </table>
    <input type="submit" value="OK"/>
</form>
<a href="/">Back to main page</a>
</body>
</html>
